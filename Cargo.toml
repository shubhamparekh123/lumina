[package]
name = "lumina"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A lightweight, extensible Linux desktop theme switcher"
license = "MIT"
keywords = ["linux", "gnome", "theme", "dark-mode"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
libc = "0.2"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
